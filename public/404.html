<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a1220" />
    <meta name="robots" content="noindex" />
    <title>404 — APEX GOAT</title>
    <link rel="icon" href="/apex-goat/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        min-height: 100dvh;
        background:
          radial-gradient(circle at 50% 18%, rgba(72, 163, 235, 0.28), transparent 56%),
          linear-gradient(180deg, #102442 0%, #0a1220 62%, #070d18 100%);
        color: #f4f7fb;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: linear-gradient(165deg, rgba(16, 26, 42, 0.64), rgba(10, 16, 28, 0.78));
        backdrop-filter: blur(18px) saturate(145%);
        -webkit-backdrop-filter: blur(18px) saturate(145%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 22px;
        padding: 28px;
        text-align: center;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.32),
          0 24px 60px rgba(0, 0, 0, 0.42);
      }
      .emblem {
        width: 72px;
        height: 72px;
        margin: 0 auto 14px;
        display: block;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
      }
      .kicker {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #74f0ff;
      }
      h1 {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -0.02em;
        margin-top: 6px;
        text-shadow: 0 3px 16px rgba(0, 0, 0, 0.35);
      }
      p {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.55;
        color: rgba(235, 243, 255, 0.86);
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        width: 100%;
        text-decoration: none;
        border-radius: 12px;
        padding: 13px 24px;
        font-size: 14.5px;
        font-weight: 800;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #06131f;
        background: linear-gradient(135deg, #5ff3ff, #4aff9c);
        box-shadow: 0 8px 24px rgba(74, 255, 156, 0.32);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 28px rgba(74, 255, 156, 0.46);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="emblem" viewBox="0 0 512 512" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#195ec2" />
            <stop offset="56%" stop-color="#48a3eb" />
            <stop offset="100%" stop-color="#8fd2f8" />
          </linearGradient>
          <linearGradient
            id="horn"
            x1="120"
            y1="70"
            x2="392"
            y2="200"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0%" stop-color="#3e4f66" />
            <stop offset="100%" stop-color="#273447" />
          </linearGradient>
          <clipPath id="clip">
            <rect width="512" height="512" rx="112" />
          </clipPath>
        </defs>
        <g clip-path="url(#clip)">
          <rect width="512" height="512" fill="url(#sky)" />
          <polygon points="0,410 116,232 232,410" fill="#d8ecfa" />
          <polygon points="116,232 162,302 232,410 116,410" fill="#7aa6ce" />
          <polygon points="280,410 396,232 512,410" fill="#c7e2f7" />
          <polygon points="396,232 442,302 512,410 396,410" fill="#5d8ab8" />
          <polygon points="0,512 128,314 256,436 256,512" fill="#e5c290" />
          <polygon points="128,314 196,436 256,436 256,512 128,512" fill="#b79162" />
          <polygon points="512,512 384,314 256,436 256,512" fill="#3a608a" />
          <polygon points="384,314 452,436 512,512 384,512" fill="#2a486b" />
          <polygon points="128,314 96,364 128,354 156,368" fill="#ffffff" />
          <polygon points="384,314 356,368 384,354 416,364" fill="#e4f2fc" />
          <polygon points="204,512 256,454 308,512" fill="#2cd4c6" />
          <polygon
            points="232,176 200,116 150,76 92,72 72,98 118,112 158,138 186,184 204,200"
            fill="url(#horn)"
          />
          <polygon
            points="72,98 118,112 158,138 186,184 204,200 186,206 148,154 106,126"
            fill="#172231"
          />
          <polygon
            points="280,176 312,116 362,76 420,72 440,98 394,112 354,138 326,184 308,200"
            fill="url(#horn)"
          />
          <polygon
            points="440,98 394,112 354,138 326,184 308,200 326,206 364,154 406,126"
            fill="#172231"
          />
          <polygon points="184,204 108,224 166,260" fill="#ffffff" />
          <polygon points="108,224 166,260 174,238" fill="#bdd5eb" />
          <polygon points="328,204 404,224 346,260" fill="#dcebf8" />
          <polygon points="404,224 346,260 338,238" fill="#8fb3d4" />
          <polygon points="256,162 182,204 256,270" fill="#ffffff" />
          <polygon points="256,162 330,204 256,270" fill="#e5f1fc" />
          <polygon points="182,204 168,272 208,358 256,270" fill="#f5faff" />
          <polygon points="330,204 344,272 304,358 256,270" fill="#c3daf0" />
          <polygon points="256,270 208,358 256,384" fill="#ffffff" />
          <polygon points="256,270 304,358 256,384" fill="#d5e7f7" />
          <polygon points="216,364 256,384 256,456" fill="#f0f7fe" />
          <polygon points="296,364 256,384 256,456" fill="#acc8e2" />
          <polygon points="190,248 228,260 214,278 186,264" fill="#162336" />
          <polygon points="322,248 284,260 298,278 326,264" fill="#162336" />
          <polygon points="232,350 256,374 280,350 256,360" fill="#1d2f47" />
          <rect
            x="6"
            y="6"
            width="500"
            height="500"
            rx="106"
            stroke="#ffffff"
            stroke-opacity="0.28"
            stroke-width="6"
          />
        </g>
      </svg>
      <div class="kicker">404 · Off The Cliff</div>
      <h1>Wrong Ridge</h1>
      <p>
        Looks like you leaped past the course boundary. Snap back to The Goat Spire and drop right
        in.
      </p>
      <a class="btn" id="home-btn" href="/apex-goat/">Back to APEX GOAT</a>
    </main>
    <script>
      if (!window.location.pathname.startsWith('/apex-goat/')) {
        document.getElementById('home-btn').setAttribute('href', '/');
      }
    </script>
  </body>
</html>
